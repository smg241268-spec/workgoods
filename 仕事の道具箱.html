<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>仕事の道具箱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF4F8; --surface:#FFFFFF; --ink:#2B2340; --sub:#6E6585; --line:#F1E2EC;
  --c-event:#3D9BE9; --c-learn:#2FB57C; --c-info:#F2A516; --c-tool:#EC5F98; --c-other:#9277E0; --c-pin:#F7C531;
  --warn-bg:#FFF6CC; --warn-ink:#6A4B00; --shadow:0 3px 0 #F1D6E4;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1E1A2B; --surface:#2A2540; --ink:#F4EEFF; --sub:#B8AED0; --line:#3B3456;
    --c-event:#6FB8F5; --c-learn:#5ED3A0; --c-info:#FFC24D; --c-tool:#FF8DBA; --c-other:#B6A0FF; --c-pin:#FFD95A;
    --warn-bg:#3D3420; --warn-ink:#FFE39A; --shadow:0 3px 0 #15121F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1A2B; --surface:#2A2540; --ink:#F4EEFF; --sub:#B8AED0; --line:#3B3456;
  --c-event:#6FB8F5; --c-learn:#5ED3A0; --c-info:#FFC24D; --c-tool:#FF8DBA; --c-other:#B6A0FF; --c-pin:#FFD95A;
  --warn-bg:#3D3420; --warn-ink:#FFE39A; --shadow:0 3px 0 #15121F;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  font-size:15px;line-height:1.65}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 60px}

.hero{position:relative;border-radius:22px;overflow:hidden;border:4px solid var(--surface);box-shadow:0 6px 0 #F3C9DD}
.hero img{display:block;width:100%;height:auto;aspect-ratio:2576/1405;object-fit:cover}
.lights{display:flex;justify-content:space-between;padding:10px 18px 0;gap:6px}
.lights span{width:12px;height:12px;border-radius:50%;background:var(--lc);box-shadow:0 0 10px var(--lc)}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:14px 0 18px}
h1{font-size:clamp(28px,6vw,40px);font-weight:900;letter-spacing:.04em;margin:0;line-height:1.15}
h1 .t1{color:var(--c-tool)} h1 .t2{color:var(--c-event)} h1 .t3{color:var(--c-learn)} h1 .t4{color:var(--c-info)} h1 .t5{color:var(--c-other)}
.status{font-size:12px;color:var(--sub);margin-top:4px}
button{font:inherit;cursor:pointer}
.btn{border:0;background:var(--c-tool);color:#fff;padding:11px 22px;border-radius:999px;font-weight:700;box-shadow:0 4px 0 color-mix(in srgb,var(--c-tool) 60%,#000)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--c-tool) 60%,#000)}
.btn.ghost{background:var(--line);color:var(--ink);box-shadow:none}
.btn:focus-visible,.tab:focus-visible,.icon:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--c-event);outline-offset:2px}

.week{background:var(--warn-bg);color:var(--warn-ink);border-radius:16px;padding:12px 16px;margin-bottom:16px;font-size:14px;border:2px dashed var(--c-info)}
.week.done{background:color-mix(in srgb,var(--c-learn) 14%,var(--surface));color:var(--ink);border-color:var(--c-learn)}
.week b{font-weight:700}

.controls{display:flex;gap:10px;flex-wrap:wrap}
.search{flex:1;min-width:200px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 18px;font:inherit}

.tabs{display:flex;gap:6px;margin-top:18px;overflow-x:auto;padding:0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:color-mix(in srgb,var(--tc) 22%,var(--bg));color:var(--ink);
  padding:10px 16px 8px;border-radius:14px 14px 0 0;font-weight:500;font-size:14px;position:relative;top:3px}
.tab .n{font-size:11px;font-weight:700;margin-left:6px;background:var(--surface);color:var(--ink);border-radius:999px;padding:0 7px}
.tab[aria-selected="true"]{background:var(--tc);color:#fff;font-weight:700;top:0;padding-bottom:11px}
.tab.light[aria-selected="true"]{color:#2B2340}
.drawer{background:var(--surface);border-radius:0 0 20px 20px;border-top:5px solid var(--active,var(--ink));min-height:200px;box-shadow:var(--shadow)}

.item{display:grid;grid-template-columns:46px 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:2px dotted var(--line)}
.item:nth-child(odd){background:color-mix(in srgb,var(--mc) 5%,transparent)}
.item:last-child{border-bottom:0;border-radius:0 0 20px 20px}
.mark{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:18px;color:#fff;background:var(--mc);box-shadow:0 3px 0 color-mix(in srgb,var(--mc) 65%,#000)}
.name{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.name a{color:var(--ink);text-decoration:none;border-bottom:3px solid color-mix(in srgb,var(--mc) 45%,transparent)}
.name a:hover{border-bottom-color:var(--mc)}
.pill{font-size:11px;font-weight:700;padding:1px 9px;border-radius:999px;background:color-mix(in srgb,var(--pc,var(--sub)) 18%,transparent);color:var(--ink)}
.pill.due{--pc:var(--c-info)} .pill.ok{--pc:var(--c-learn)}
.memo{font-size:13px;color:var(--sub);margin-top:2px;word-break:break-word}
.meta{font-size:12px;color:var(--sub);margin-top:2px}
.actions{display:flex;gap:6px;align-items:center}
.icon{border:2px solid color-mix(in srgb,var(--mc) 40%,transparent);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.icon:hover{background:color-mix(in srgb,var(--mc) 14%,var(--surface))}
.icon.star{border:0;background:transparent;font-size:20px;padding:2px 6px;color:var(--sub)}
.icon.star[aria-pressed="true"]{color:var(--c-pin);text-shadow:0 0 8px color-mix(in srgb,var(--c-pin) 60%,transparent)}
.empty{padding:48px 20px;text-align:center;color:var(--sub)}

dialog{border:0;border-radius:22px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100% - 28px));border-top:8px solid var(--c-tool)}
dialog::backdrop{background:rgba(40,20,50,.45)}
.dlg{padding:22px}
.dlg h2{margin:0 0 14px;font-size:20px}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
.dlg input[type=text],.dlg input[type=url],.dlg select,.dlg textarea{width:100%;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 12px;font:inherit}
.check{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px;margin-top:14px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.row .left{margin-right:auto}
.btn.danger{background:transparent;color:#D0344A;box-shadow:none;border:2px solid #D0344A}
.err{color:#D0344A;font-size:13px;margin-top:6px;min-height:1em}

@media (max-width:560px){
  .item{grid-template-columns:38px 1fr;padding:14px}
  .mark{width:38px;height:38px;font-size:15px}
  .actions{grid-column:1/-1;justify-content:flex-end}
  .hero{border-radius:16px}
}
@media (prefers-reduced-motion:no-preference){
  .item.flash{animation:flash .9s ease}
  @keyframes flash{from{background:color-mix(in srgb,var(--mc) 25%,transparent)}to{background:transparent}}
  .lights span{animation:twinkle 2.4s ease-in-out infinite;animation-delay:calc(var(--i) * .2s)}
  @keyframes twinkle{50%{opacity:.45}}
}
</style>
</head>

].map((x,i)=>({id:'d'+i, pin:false, checked:0, ...x}));

const KEY = 'toolbox-v1';
let items = loadLocal() || structuredClone(DEFAULTS);
let tab = 'all', query = '', editing = null, dbRef = null;
let writing = false, dirty = false, saveTimer = null;

const $ = id => document.getElementById(id);
const catOf = id => CATS.find(c=>c.id===id) || CATS[4];
const cssVar = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function loadLocal(){
  try{ const r = localStorage.getItem(KEY); if(!r) return null; const d = JSON.parse(r); return Array.isArray(d.items) ? d.items : null; }
  catch(e){ return null; }
}
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify({items})); }catch(e){} }

function weekStart(){
  const d = new Date(); d.setHours(0,0,0,0);
  const day = (d.getDay()+6)%7; d.setDate(d.getDate()-day); return d.getTime();
}
function ago(t){
  if(!t) return 'まだ確認していません';
  const days = Math.floor((Date.now()-t)/86400000);
  if(days<=0) return '今日確認';
  if(days===1) return '昨日確認';
  return days+'日前に確認';
}
function domain(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return u; } }

function changed(){
  saveLocal(); render();
  if(!dbRef) return;
  dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 600);
}
async function flush(){
  if(!dbRef || writing || !dirty) return;
  writing = true; dirty = false;
  try{ await dbRef.set({items}); setStatus('アカウントに保存しました'); }
  catch(e){ setStatus('保存できませんでした。この端末には残っています'); }
  writing = false;
  if(dirty) flush();
}
function setStatus(t){ $('status').textContent = t; }

function renderWeek(){
  const ws = weekStart();
  const due = items.filter(i=>i.weekly && (i.checked||0) < ws);
  const el = $('week'); el.replaceChildren();
  const total = items.filter(i=>i.weekly).length;
  if(!total){ el.hidden = true; return; }
  el.hidden = false;
  el.classList.toggle('done', due.length===0);
  const t = document.createElement('div');
  if(due.length){
    const b = document.createElement('b'); b.textContent = '今週まだ見ていないサイト：'+due.length+'件';
    t.append(b, document.createTextNode('　'+due.map(d=>d.name).join('、')));
  } else {
    t.textContent = '今週のチェックは完了です（'+total+'件）';
  }
  el.append(t);
}

function renderTabs(){
  const el = $('tabs'); el.replaceChildren();
  const all = [{id:'all',label:'すべて',color:'--c-other'}, {id:'pin',label:'★ よく使う',color:'--c-pin'}, ...CATS];
  for(const c of all){
    const n = c.id==='all' ? items.length : c.id==='pin' ? items.filter(i=>i.pin).length : items.filter(i=>i.cat===c.id).length;
    if(c.id==='other' && n===0) continue;
    const b = document.createElement('button');
    b.className='tab'+((c.id==='pin'||c.id==='info')?' light':''); b.setAttribute('role','tab'); b.setAttribute('aria-selected', tab===c.id);
    b.style.setProperty('--tc', `var(${c.color})`);
    b.textContent = c.label;
    const s = document.createElement('span'); s.className='n'; s.textContent = n; b.append(s);
    b.onclick = ()=>{ tab=c.id; render(); };
    el.append(b);
    if(tab===c.id) $('drawer').style.setProperty('--active', `var(${c.color})`);
  }
}

function renderList(){
  const el = $('drawer'); el.replaceChildren();
  const q = query.trim().toLowerCase();
  let list = items.filter(i=>{
    if(tab==='pin' && !i.pin) return false;
    if(tab!=='all' && tab!=='pin' && i.cat!==tab) return false;
    if(q && !(i.name+' '+i.memo+' '+i.url).toLowerCase().includes(q)) return false;
    return true;
  });
  list.sort((a,b)=> (b.pin-a.pin) || CATS.findIndex(c=>c.id===a.cat)-CATS.findIndex(c=>c.id===b.cat));
  if(!list.length){
    const e = document.createElement('div'); e.className='empty';
    e.textContent = q ? '「'+query+'」に当てはまるサイトはありません' : 'ここにはまだサイトがありません。右上の「サイトを追加」から登録できます';
    el.append(e); return;
  }
  const ws = weekStart();
  for(const it of list){
    const c = catOf(it.cat);
    const row = document.createElement('div'); row.className='item'; row.dataset.id = it.id;
    row.style.setProperty('--mc', `var(${c.color})`);

    const m = document.createElement('div'); m.className='mark'; m.textContent = (it.name||'?').trim().charAt(0).toUpperCase(); m.setAttribute('aria-hidden','true');

    const body = document.createElement('div');
    const nm = document.createElement('div'); nm.className='name';
    const a = document.createElement('a'); a.href = it.url; a.target='_blank'; a.rel='noopener noreferrer'; a.textContent = it.name;
    a.onclick = ()=>{ it.checked = Date.now(); changed(); };
    nm.append(a);
    if(tab==='all' || tab==='pin'){ const p = document.createElement('span'); p.className='pill'; p.style.setProperty('--pc',`var(${c.color})`); p.textContent=c.label; nm.append(p); }
    if(it.weekly){
      const p = document.createElement('span'); const due = (it.checked||0) < ws;
      p.className = 'pill'+(due?' due':' ok'); p.textContent = due ? '今週未チェック' : '今週チェック済み'; nm.append(p);
    }
    body.append(nm);
    if(it.memo){ const me = document.createElement('div'); me.className='memo'; me.textContent = it.memo; body.append(me); }
    const mt = document.createElement('div'); mt.className='meta'; mt.textContent = domain(it.url)+'　'+ago(it.checked); body.append(mt);

    const act = document.createElement('div'); act.className='actions';
    const star = document.createElement('button'); star.className='icon star'; star.textContent = it.pin ? '★' : '☆';
    star.setAttribute('aria-pressed', !!it.pin); star.setAttribute('aria-label', it.pin ? 'よく使うから外す' : 'よく使うに入れる');
    star.onclick = ()=>{ it.pin = !it.pin; changed(); };
    const chk = document.createElement('button'); chk.className='icon'; chk.textContent='確認した';
    chk.onclick = ()=>{ it.checked = Date.now(); changed(); const r = document.querySelector(`.item[data-id="${it.id}"]`); if(r){ r.classList.add('flash'); } };
    const ed = document.createElement('button'); ed.className='icon'; ed.textContent='編集';
    ed.onclick = ()=>openDlg(it);
    act.append(star, chk, ed);

    row.append(m, body, act);
    el.append(row);
  }
}

function render(){ renderWeek(); renderTabs(); renderList(); }

// dialog
const sel = $('fCat');
for(const c of CATS){ const o = document.createElement('option'); o.value=c.id; o.textContent=c.label; sel.append(o); }
function openDlg(it){
  editing = it || null;
  $('dlgTitle').textContent = it ? 'サイトを編集' : 'サイトを追加';
  $('fName').value = it ? it.name : '';
  $('fUrl').value = it ? it.url : '';
  $('fCat').value = it ? it.cat : (CATS.some(c=>c.id===tab) ? tab : 'event');
  $('fMemo').value = it ? it.memo : '';
  $('fWeekly').checked = it ? !!it.weekly : false;
  $('delBtn').hidden = !it;
  $('fErr').textContent = '';
  $('dlg').showModal();
  $('fName').focus();
}
$('addBtn').onclick = ()=>openDlg(null);
$('cancelBtn').onclick = ()=>$('dlg').close();
$('form').addEventListener('submit', e=>{
  e.preventDefault();
  const name = $('fName').value.trim();
  let url = $('fUrl').value.trim();
  if(url && !/^https?:\/\//i.test(url)) url = 'https://'+url;
  try{ new URL(url); }catch(_){ $('fErr').textContent = 'URLの形式が正しくありません。https:// から始まるアドレスを入力してください'; return; }
  if(!name){ $('fErr').textContent = '名前を入力してください'; return; }
  const data = {name, url, cat:$('fCat').value, memo:$('fMemo').value.trim(), weekly:$('fWeekly').checked};
  if(editing) Object.assign(editing, data);
  else items.push({id:'u'+Date.now().toString(36), pin:false, checked:0, ...data});
  $('dlg').close(); changed();
});
$('fUrl').addEventListener('input', ()=>{ $('fErr').textContent=''; });
$('delBtn').onclick = ()=>{
  if(!editing) return;
  if(!confirm('「'+editing.name+'」を削除します。よろしいですか？')) return;
  items = items.filter(i=>i!==editing); $('dlg').close(); changed();
};
$('q').addEventListener('input', e=>{ query = e.target.value; renderList(); });

render();

// account sync (falls back to this device only)
(async ()=>{
  if(!window.claude || !claude.use) return;
  try{
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!db || !user) return;
    const id = await user.id();
    if(!id) return;
    const ref = db.collection('data/users/'+id).doc('toolbox');
    const snap = await ref.get();
    if(snap.exists){
      const d = snap.data();
      if(d && Array.isArray(d.items)){ items = d.items; saveLocal(); render(); }
    }
    dbRef = ref;
    setStatus('アカウントに保存しています（ほかの端末でも同じ内容）');
  }catch(e){
    setStatus('この端末に保存しています');
  }
})();
</script>
</body>
</html>
